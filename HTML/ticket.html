
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Coding Conf Ticket</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ticket.js" defer></script>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="../assets/images/logo-full.svg" alt="Coding Conf">
        </a>
    </header>

    <main class="ticket-page">

        <section class="ticket-heading">
            <p class="event-label">CODING CONF 2026</p>

            <h1>Your ticket is ready!</h1>

            <p class="hero-description">
                Thank you for registering. We look forward to seeing you!
            </p>
        </section>

        <section class="ticket">

            <div class="ticket-top">

                <div class="ticket-brand">
                    <img
                        src="../assets/images/logo-full.svg"
                        alt="Coding Conf"
                    >

                    <p>October 26, 2026</p>
                    <p>Papine, Kingston, Jamaica</p>
                </div>

                <p class="ticket-number" id="ticketNumber">#01609</p>

            </div>

            <div class="ticket-attendee">

                <img
                    id="ticketAvatar"
                    src=""
                    alt="Attendee profile picture"
                >

                <div class="ticket-person">

                    <h2 id="ticketFullName">Your Name</h2>

                    <p id="ticketGithub">@username</p>

                    <p id="ticketEmail">your@email.com</p>

                </div>

            </div>

        </section>

        <div class="ticket-back">
            <a href="index.html" class="register-button">
                &larr; Back to Home
            </a>
        </div>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>
</html>
