
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Coding Conf 2026</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/validation.js" defer></script>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="../assets/images/logo-full.svg" alt="Coding Conf">
        </a>
    </header>

    <main>
        <section class="hero">

            <p class="event-label">CODING CONF 2026</p>

            <h1>Register for<br>Coding Conf</h1>

            <p class="hero-description">
                Enter your details below to reserve your place at the conference.
            </p>

            <form id="registrationForm" class="registration-form">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="github">GitHub Username</label>

                    <input
                        type="text"
                        id="github"
                        name="github"
                        placeholder="@username"
                        required
                    >
                </div>

                <div class="form-group avatar-group">

                    <label for="avatar">Upload Avatar</label>

                    <div id="avatarDropzone" class="avatar-dropzone">

                        <div id="uploadContent">
                            <img
                                src="../assets/images/icon-upload.svg"
                                alt=""
                                class="upload-icon"
                            >

                            <p>Drag and drop or click to upload</p>

                            <span>JPG or PNG, maximum 500 KB</span>
                        </div>

                    </div>

                    <input
                        type="file"
                        id="avatar"
                        name="avatar"
                        accept=".jpg,.jpeg,.png"
                        hidden
                    >

                    <div id="avatarPreview" class="avatar-preview" hidden>

                        <img
                            id="previewImage"
                            src=""
                            alt="Avatar preview"
                        >

                        <p id="avatarFileName"></p>

                        <div class="avatar-actions">

                            <button type="button" id="changeImage">
                                Change Image
                            </button>

                            <button type="button" id="removeImage">
                                Remove Image
                            </button>

                        </div>
                    </div>

                    <p class="form-help">
                        Upload a JPG or PNG image. Maximum file size: 500 KB.
                    </p>

                </div>

                <p id="errorMessage" class="error-message" role="alert"></p>

                <button type="submit" class="register-button">
                    Generate My Ticket <span aria-hidden="true">&rarr;</span>
                </button>

            </form>

        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>
</html>
